<div class="max-w-7xl mx-auto space-y-6">
  
  <header class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div class="flex items-center gap-4">
      <h1 class="text-2xl font-bold text-black dark:text-white tracking-tight sm:text-3xl">
        Analytics
      </h1>
      @if (authService.isAdmin) {
        <button 
          (click)="resyncAnalytics()" 
          [disabled]="isResyncing()"
          class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors border border-slate-200 dark:border-slate-700 shadow-sm disabled:opacity-50">
          
          @if (isResyncing()) {
            <svg class="animate-spin w-4 h-4 text-accent-pos" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Syncing...
          } @else if (resyncSuccess()) {
            <svg class="w-4 h-4 text-accent-pos" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>
            Synced!
          } @else {
            <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
            Resync Data
          }
        </button>
      }
    </div>

    <!-- Tab Pill Switcher -->
    <div id="tutorial-analytics-tabs" class="inline-flex p-1 bg-slate-100 dark:bg-slate-800/80 rounded-xl border border-slate-200/80 dark:border-slate-800">
      <button 
        (click)="activeTab.set('volume')"
        [class.bg-white]="activeTab() === 'volume'"
        [class.dark:bg-slate-900]="activeTab() === 'volume'"
        [class.text-slate-900]="activeTab() === 'volume'"
        [class.dark:text-white]="activeTab() === 'volume'"
        [class.shadow-sm]="activeTab() === 'volume'"
        [class.text-slate-500]="activeTab() !== 'volume'"
        [class.dark:text-slate-400]="activeTab() !== 'volume'"
        class="flex items-center gap-2 px-4 py-2 text-xs font-semibold rounded-lg transition-all">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
        Program Volume
      </button>

      <button 
        (click)="activeTab.set('exercise')"
        [class.bg-white]="activeTab() === 'exercise'"
        [class.dark:bg-slate-900]="activeTab() === 'exercise'"
        [class.text-slate-900]="activeTab() === 'exercise'"
        [class.dark:text-white]="activeTab() === 'exercise'"
        [class.shadow-sm]="activeTab() === 'exercise'"
        [class.text-slate-500]="activeTab() !== 'exercise'"
        [class.dark:text-slate-400]="activeTab() !== 'exercise'"
        class="flex items-center gap-2 px-4 py-2 text-xs font-semibold rounded-lg transition-all">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
        </svg>
        Exercise Progression
      </button>

      <button 
        (click)="activeTab.set('cardio')"
        [class.bg-white]="activeTab() === 'cardio'"
        [class.dark:bg-slate-900]="activeTab() === 'cardio'"
        [class.text-slate-900]="activeTab() === 'cardio'"
        [class.dark:text-white]="activeTab() === 'cardio'"
        [class.shadow-sm]="activeTab() === 'cardio'"
        [class.text-slate-500]="activeTab() !== 'cardio'"
        [class.dark:text-slate-400]="activeTab() !== 'cardio'"
        class="flex items-center gap-2 px-4 py-2 text-xs font-semibold rounded-lg transition-all">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        Cardio Progression
      </button>
    </div>
  </header>
 
  <div class="mt-4">
    @if (activeTab() === 'volume') {
      <app-progress-chart></app-progress-chart>
    }
    @if (activeTab() === 'exercise') {
      <app-exercise-progress-chart></app-exercise-progress-chart>
    }
    @if (activeTab() === 'cardio') {
      <app-cardio-progress-chart></app-cardio-progress-chart>
    }
  </div>
 
</div>
