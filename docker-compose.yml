# =============================================================
# Yes App — Full Stack Compose
# Usage: docker-compose up
# Requires a .env file at the project root (copy from .env.example).
# =============================================================

services:

  # -----------------------------------------------------------
  # Database — shared PostgreSQL instance, one schema per service
  # -----------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not exposed externally — accessed only via internal Docker network.
    # Use docker-compose.dev.yml to expose 5432 for local DB tools.

  # -----------------------------------------------------------
  # Redis — used for API Gateway rate limiting
  # -----------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Not exposed externally.

  # -----------------------------------------------------------
  # auth-service (port 8081)
  # -----------------------------------------------------------
  auth-service:
    image: ghcr.io/jsr-mario/training-app/auth-service:main
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRY_MINUTES: ${JWT_ACCESS_EXPIRY_MINUTES}
      JWT_REFRESH_EXPIRY_DAYS: ${JWT_REFRESH_EXPIRY_DAYS}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Port is intentionally NOT published — only the gateway reaches this service.

  # -----------------------------------------------------------
  # training-service (port 8082)
  # -----------------------------------------------------------
  training-service:
    image: ghcr.io/jsr-mario/training-app/training-service:main
    build:
      context: .
      dockerfile: services/training-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Port intentionally not published.

  # -----------------------------------------------------------
  # analytics-service (port 8083)
  # -----------------------------------------------------------
  analytics-service:
    image: ghcr.io/jsr-mario/training-app/analytics-service:main
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Port intentionally not published.

  # -----------------------------------------------------------
  # api-gateway (Internal port 8080) — no longer public, routed via Caddy
  # -----------------------------------------------------------
  api-gateway:
    image: ghcr.io/jsr-mario/training-app/api-gateway:main
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      TRAINING_SERVICE_URL: ${TRAINING_SERVICE_URL}
      ANALYTICS_SERVICE_URL: ${ANALYTICS_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      auth-service:
        condition: service_healthy
      training-service:
        condition: service_healthy
      analytics-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8090/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -----------------------------------------------------------
  # frontend — nginx serving the Angular PWA (Internal port 80)
  # -----------------------------------------------------------
  frontend:
    image: ghcr.io/jsr-mario/training-app/frontend:main
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # -----------------------------------------------------------
  # Caddy — Internal HTTP Proxy (Traffic now comes from Tunnel)
  # -----------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  # -----------------------------------------------------------
  # Cloudflare Tunnel — Secure ingress, no exposed ports
  # -----------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - caddy

  # -----------------------------------------------------------
  # Node Exporter — Host OS Metrics (CPU, RAM, Disk)
  # -----------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:v1.8.1
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          memory: 50m
        reservations:
          memory: 15m

  # -----------------------------------------------------------
  # Prometheus — Metrics Collection
  # -----------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=48h'
    deploy:
      resources:
        limits:
          memory: 250m
        reservations:
          memory: 150m
    volumes:
      - ./docs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - node-exporter

  # -----------------------------------------------------------
  # Loki — Centralized Log Aggregation
  # -----------------------------------------------------------
  loki-init:
    image: alpine
    restart: "no"
    command: chown -R 10001:10001 /tmp/loki
    volumes:
      - loki_data:/tmp/loki

  loki:
    image: grafana/loki:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yml
    deploy:
      resources:
        limits:
          memory: 300m
        reservations:
          memory: 150m
    depends_on:
      loki-init:
        condition: service_completed_successfully
    volumes:
      - ./docs/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/tmp/loki

  # -----------------------------------------------------------
  # Promtail — Docker Container Log Scraper
  # -----------------------------------------------------------
  promtail:
    image: grafana/promtail:3.0.0
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yml
    deploy:
      resources:
        limits:
          memory: 50m
    volumes:
      - ./docs/observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  # -----------------------------------------------------------
  # Grafana — Visualization & Dashboards
  # -----------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 250m
        reservations:
          memory: 150m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # SMTP Resend para Alertas por Correo
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: "${SPRING_MAIL_HOST:-smtp.resend.com}:587"
      GF_SMTP_USER: "${SPRING_MAIL_USERNAME:-resend}"
      GF_SMTP_PASSWORD: "${SPRING_MAIL_PASSWORD}"
      GF_SMTP_FROM_ADDRESS: "noreply@jsr-mario.com"
      GF_SMTP_FROM_NAME: "Yes App - Grafana Monitoring"
      GF_SMTP_SKIP_VERIFY: "false"
    volumes:
      - ./docs/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docs/observability/grafana/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./docs/observability/grafana/dashboards/system-health.json:/var/lib/grafana/dashboards/system-health.json:ro
      - ./docs/observability/grafana/alerting:/etc/grafana/provisioning/alerting:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
      - node-exporter

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  prometheus_data:
    driver: local
  loki_data:
    driver: local
  grafana_data:
    driver: local

